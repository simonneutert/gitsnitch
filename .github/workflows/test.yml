name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: turtlequeue/setup-babashka@v1.8.0
        with:
          babashka-version: 1.13.223

      - name: Run unit + integration tests
        run: bb test
